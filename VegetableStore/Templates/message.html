<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} · Овочева крамниця</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="/">🥕 Овочева крамниця</a>
            <span class="tagline">CRUD на ASP.NET</span>
        </div>
    </header>

    <main class="container container-narrow">
        <section class="card message">
            <div class="message-icon">🥔</div>
            <h1>{{title}}</h1>
            <p class="muted">{{message}}</p>
            <a class="btn btn-primary" href="/">На головну</a>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">Навчальний проєкт · ASP.NET Minimal API</div>
    </footer>
</body>
</html>
